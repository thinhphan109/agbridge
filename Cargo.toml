[workspace]
resolver = "2"
members = [
    "crates/agbridge-cli",
    "crates/agbridge-core",
    "crates/agbridge-cert",
    "crates/agbridge-dns",
    "crates/agbridge-trust",
    "crates/agbridge-config",
    "crates/agbridge-handlers",
    "crates/agbridge-eventstream",
    "crates/agbridge-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["9router contributors"]
repository = "https://github.com/decolua/agbridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"

# HTTP
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }

# Cert
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
rsa = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
crc32fast = "1.4"

# Test only
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
