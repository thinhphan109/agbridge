name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows MSI + portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agbridge

      - name: cargo build --release
        working-directory: agbridge
        run: cargo build --release --bin agbridge

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      - name: Build MSI
        working-directory: agbridge
        run: cargo wix --no-build --nocapture --output target/wix/agbridge.msi

      - name: Compute SHA256
        shell: pwsh
        working-directory: agbridge
        run: |
          (Get-FileHash target/release/agbridge.exe -Algorithm SHA256).Hash | Out-File target/release/agbridge.exe.sha256 -Encoding ascii
          (Get-FileHash target/wix/agbridge.msi -Algorithm SHA256).Hash | Out-File target/wix/agbridge.msi.sha256 -Encoding ascii

      - name: Create portable zip
        shell: pwsh
        working-directory: agbridge
        run: |
          Compress-Archive -Path target/release/agbridge.exe, target/release/agbridge.exe.sha256, README.md, LICENSE -DestinationPath target/release/agbridge-windows-x64.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            agbridge/target/release/agbridge-windows-x64.zip
            agbridge/target/wix/agbridge.msi
            agbridge/target/wix/agbridge.msi.sha256
          generate_release_notes: true
